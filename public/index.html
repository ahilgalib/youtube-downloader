<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YouTube Downloader</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><rect width='24' height='24' rx='6' fill='%23ef4444'/><path d='M12 6v8m0 0-3.5-3.5M12 14l3.5-3.5M7 18h10' stroke='white' stroke-width='2' fill='none' stroke-linecap='round'/></svg>">
<style>
  :root {
    --bg: #fafafa; --card: #fff; --fg: #111; --muted: #6b7280; --line: #e5e7eb;
    --soft: #f3f4f6; --accent: #ef4444; --accent-fg: #fff; --ok: #16a34a; --err: #dc2626;
    --r: 12px;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0b0b0c; --card: #141416; --fg: #f4f4f5; --muted: #9ca3af; --line: #26262a; --soft: #1c1c1f; }
  }
  * { box-sizing: border-box; margin: 0; }
  body { font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--fg);
         min-height: 100vh; display: flex; justify-content: center; padding: 48px 16px; }
  .wrap { width: 100%; max-width: 560px; }
  header { text-align: center; margin-bottom: 24px; }
  h1 { font-size: 22px; font-weight: 650; letter-spacing: -.02em; display: inline-flex; align-items: center; gap: 8px; }
  h1 i { width: 26px; height: 26px; border-radius: 7px; background: var(--accent); display: grid; place-items: center; }
  .tag { color: var(--muted); font-size: 12px; margin-top: 4px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px; }
  .row { display: flex; gap: 8px; }
  input, select { font: inherit; color: inherit; background: var(--soft); border: 1px solid transparent; border-radius: 10px;
                  padding: 10px 12px; width: 100%; outline: none; transition: border-color .15s; }
  input:focus, select:focus { border-color: var(--accent); }
  button { font: inherit; font-weight: 600; border: 0; border-radius: 10px; padding: 10px 16px; cursor: pointer;
           background: var(--fg); color: var(--bg); white-space: nowrap; transition: opacity .15s; }
  button:disabled { opacity: .5; cursor: default; }
  button.primary { background: var(--accent); color: var(--accent-fg); width: 100%; padding: 12px; margin-top: 14px; }
  .hidden { display: none !important; }
  .meta { display: flex; gap: 12px; margin-top: 16px; align-items: center; }
  .meta img { width: 120px; aspect-ratio: 16/9; object-fit: cover; border-radius: 8px; background: var(--soft); flex: none; }
  .meta b { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; font-weight: 600; }
  .meta small { color: var(--muted); }
  .tabs { display: grid; grid-template-columns: 1fr 1fr; background: var(--soft); border-radius: 10px; padding: 3px; margin: 16px 0 12px; }
  .tabs button { background: transparent; color: var(--muted); padding: 7px; }
  .tabs button.on { background: var(--card); color: var(--fg); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { background: var(--soft); color: var(--fg); font-weight: 500; padding: 6px 10px; border: 1px solid transparent; font-size: 13px; }
  .chip small { color: var(--muted); font-weight: 400; margin-left: 4px; }
  .chip.on { border-color: var(--accent); color: var(--accent); }
  .chip.on small { color: inherit; opacity: .7; }
  label.l { display: block; font-size: 12px; color: var(--muted); margin: 12px 0 6px; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  details { margin-top: 14px; border-top: 1px solid var(--line); padding-top: 10px; }
  summary { cursor: pointer; color: var(--muted); font-size: 13px; list-style: none; user-select: none; }
  summary::before { content: "+ "; }
  details[open] summary::before { content: "− "; }
  .checks { display: flex; flex-wrap: wrap; gap: 6px 14px; }
  .checks label { display: flex; align-items: center; gap: 6px; font-size: 13px; cursor: pointer; }
  .checks input { width: auto; accent-color: var(--accent); }
  .prog { margin-top: 14px; }
  .bar { height: 6px; background: var(--soft); border-radius: 99px; overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .3s; }
  .bar.busy i { width: 35% !important; animation: slide 1.1s infinite ease-in-out; }
  @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(300%); } }
  .pinfo { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-top: 6px; }
  .msg { margin-top: 12px; font-size: 13px; padding: 10px 12px; border-radius: 10px; }
  .msg.err { background: color-mix(in srgb, var(--err) 12%, transparent); color: var(--err); }
  .msg.ok { background: color-mix(in srgb, var(--ok) 12%, transparent); color: var(--ok); }
  .msg a { color: inherit; font-weight: 600; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; font-variant-numeric: tabular-nums; }
  td, th { padding: 4px 6px; text-align: left; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th { color: var(--muted); font-weight: 500; }
  tr.fmt { cursor: pointer; } tr.fmt:hover { background: var(--soft); }
  .fmtbox { max-height: 220px; overflow: auto; margin-top: 8px; border: 1px solid var(--line); border-radius: 8px; }
  footer { text-align: center; color: var(--muted); font-size: 11px; margin-top: 18px; }
  .spin { width: 14px; height: 14px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%;
          display: inline-block; animation: r .7s linear infinite; vertical-align: -2px; }
  @keyframes r { to { transform: rotate(360deg); } }
  @media (max-width: 480px) { .grid { grid-template-columns: 1fr 1fr; } .meta img { width: 96px; } body { padding-top: 28px; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1><i><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11m0 0-5-5m5 5 5-5M5 20h14"/></svg></i>YouTube Downloader</h1>
    <div class="tag">Just for educational purposes</div>
  </header>

  <div class="card">
    <form id="f" class="row">
      <input id="url" type="url" placeholder="Paste a YouTube link…" autocomplete="off" required>
      <button id="go">Fetch</button>
    </form>
    <div id="err0" class="msg err hidden"></div>

    <div id="panel" class="hidden">
      <div class="meta">
        <img id="thumb" alt="">
        <div><b id="title"></b><small id="sub"></small></div>
      </div>

      <div class="tabs">
        <button type="button" data-mode="video" class="on">Video</button>
        <button type="button" data-mode="audio">Audio</button>
      </div>

      <!-- VIDEO -->
      <div id="video">
        <label class="l">Resolution</label>
        <div id="res" class="chips"></div>
        <div class="grid">
          <div><label class="l">Container</label>
            <select id="container"><option value="mp4">MP4</option><option value="mkv">MKV</option><option value="webm">WEBM</option><option value="auto">Original</option></select></div>
          <div><label class="l">Codec</label>
            <select id="vcodec"><option value="h264">H.264 (best compat)</option><option value="any">Best available</option><option value="vp9">VP9</option><option value="av01">AV1</option></select></div>
          <div><label class="l">Max FPS</label>
            <select id="fps"><option value="">Best</option><option value="60">60</option><option value="30">30</option><option value="24">24</option></select></div>
        </div>
      </div>

      <!-- AUDIO -->
      <div id="audio" class="hidden">
        <label class="l">Format</label>
        <div id="afmt" class="chips">
          <button type="button" class="chip on" data-v="mp3">MP3</button>
          <button type="button" class="chip" data-v="m4a">M4A</button>
          <button type="button" class="chip" data-v="opus">OPUS</button>
          <button type="button" class="chip" data-v="flac">FLAC</button>
          <button type="button" class="chip" data-v="wav">WAV</button>
          <button type="button" class="chip" data-v="best">Original</button>
        </div>
        <label class="l">Quality</label>
        <select id="aq">
          <option value="320K">320 kbps</option><option value="256K">256 kbps</option><option value="192K" selected>192 kbps</option>
          <option value="128K">128 kbps</option><option value="96K">96 kbps</option><option value="0">Best VBR</option>
        </select>
      </div>

      <details>
        <summary>Advanced options</summary>
        <div class="grid2">
          <div><label class="l">Trim start</label><input id="start" placeholder="0:00"></div>
          <div><label class="l">Trim end</label><input id="end" placeholder="end"></div>
        </div>

        <div id="subsBox">
          <label class="l">Subtitles (embedded)</label>
          <div class="grid2">
            <select id="subs"><option value="">None</option></select>
            <div class="checks" style="align-items:center"><label><input type="checkbox" id="autoSubs"> Auto-generated</label></div>
          </div>
        </div>

        <label class="l">Embed</label>
        <div class="checks">
          <label><input type="checkbox" id="thumbnail" checked> Thumbnail</label>
          <label><input type="checkbox" id="metadata" checked> Metadata</label>
          <label id="chapLbl"><input type="checkbox" id="chapters" checked> Chapters</label>
        </div>

        <label class="l">SponsorBlock — remove segments</label>
        <div class="checks" id="sb">
          <label><input type="checkbox" value="sponsor"> Sponsor</label>
          <label><input type="checkbox" value="selfpromo"> Self-promo</label>
          <label><input type="checkbox" value="interaction"> Subscribe reminders</label>
          <label><input type="checkbox" value="intro"> Intro</label>
          <label><input type="checkbox" value="outro"> Outro</label>
          <label><input type="checkbox" value="music_offtopic"> Non-music</label>
        </div>

        <div class="grid2">
          <div><label class="l">Filename</label><input id="filename" value="%(title)s" spellcheck="false"></div>
          <div><label class="l">Speed limit</label><input id="rate" placeholder="e.g. 2M (unlimited)"></div>
        </div>

        <label class="l">Exact format ID <span style="opacity:.7">(overrides choices above — click a row)</span></label>
        <input id="formatId" placeholder="e.g. 137+140" spellcheck="false">
        <div class="fmtbox"><table><thead><tr><th>ID</th><th>Ext</th><th>Res</th><th>FPS</th><th>Video</th><th>Audio</th><th>Size</th></tr></thead><tbody id="fmts"></tbody></table></div>
      </details>

      <button id="dl" class="primary" type="button">Download</button>

      <div id="prog" class="prog hidden">
        <div class="bar" id="bar"><i></i></div>
        <div class="pinfo"><span id="stage"></span><span id="pstat"></span></div>
      </div>
      <div id="msg" class="msg hidden"></div>
    </div>
  </div>
  <footer>Respect copyright &amp; YouTube's Terms. Download only content you own or have permission to use.</footer>
</div>

<script>
const $ = id => document.getElementById(id);
let info = null, mode = 'video', height = 'best', afmt = 'mp3', job = null, timer = null;

const fmtSize = b => !b ? '' : b > 1e9 ? (b / 1e9).toFixed(2) + ' GB' : b > 1e6 ? (b / 1e6).toFixed(1) + ' MB' : (b / 1e3 | 0) + ' KB';
const fmtTime = s => { if (!s) return ''; s = Math.round(s); const h = s / 3600 | 0, m = (s % 3600) / 60 | 0, x = s % 60;
  return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(x).padStart(2, '0'); };
const fmtNum = n => n == null ? '' : Intl.NumberFormat('en', { notation: 'compact' }).format(n) + ' views';
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const label = h => h >= 4320 ? '8K' : h >= 2160 ? '4K' : h >= 1440 ? '2K' : h + 'p';

function show(el, on) { $(el).classList.toggle('hidden', !on); }
function msg(text, type) { const m = $('msg'); m.className = 'msg ' + type; m.innerHTML = text; }

async function api(path, body) {
  const r = await fetch(path, body ? { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) } : {});
  const j = await r.json().catch(() => ({ error: 'Server error' }));
  if (!r.ok) throw new Error(j.error || 'Request failed');
  return j;
}

// ---- fetch info ----
$('f').onsubmit = async e => {
  e.preventDefault();
  const btn = $('go');
  btn.disabled = true; btn.innerHTML = '<span class="spin"></span>';
  show('err0', false); show('panel', false); resetJob();
  try {
    info = await api('/api/info', { url: $('url').value.trim() });
    render();
  } catch (err) {
    $('err0').textContent = err.message; show('err0', true);
  } finally { btn.disabled = false; btn.textContent = 'Fetch'; }
};

function render() {
  $('thumb').src = info.thumbnail || '';
  $('title').textContent = info.title;
  $('sub').textContent = [info.channel, fmtTime(info.duration), fmtNum(info.views)].filter(Boolean).join(' · ');

  height = 'best';
  const best = info.qualities[0];
  $('res').innerHTML = `<button type="button" class="chip on" data-v="best">Best${best ? `<small>${label(best.height)}</small>` : ''}</button>` +
    info.qualities.map(q => `<button type="button" class="chip" data-v="${q.height}">${label(q.height)}${q.fps > 30 ? q.fps : ''}<small>${fmtSize(q.size)}</small></button>`).join('');

  const manual = info.subtitles.map(l => `<option value="${esc(l)}">${esc(l)}</option>`).join('');
  const auto = info.autoSubtitles.filter(l => !info.subtitles.includes(l)).map(l => `<option value="${esc(l)}" data-auto="1">${esc(l)} (auto)</option>`).join('');
  $('subs').innerHTML = '<option value="">None</option>' + (manual ? `<optgroup label="Subtitles">${manual}</optgroup>` : '') + (auto ? `<optgroup label="Auto-generated">${auto}</optgroup>` : '');
  show('chapLbl', info.chapters > 0);

  $('fmts').innerHTML = info.formats.slice().reverse().map(f =>
    `<tr class="fmt" data-id="${esc(f.id)}"><td>${esc(f.id)}</td><td>${esc(f.ext)}</td><td>${esc(f.res)}</td><td>${f.fps || ''}</td>` +
    `<td>${f.vcodec === 'none' ? '—' : esc((f.vcodec || '').split('.')[0])}</td><td>${f.acodec === 'none' ? '—' : esc((f.acodec || '').split('.')[0])}</td><td>${fmtSize(f.size)}</td></tr>`).join('');
  show('panel', true);
}

// ---- choices ----
document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => {
  mode = b.dataset.mode;
  document.querySelectorAll('.tabs button').forEach(x => x.classList.toggle('on', x === b));
  show('video', mode === 'video'); show('audio', mode === 'audio'); show('subsBox', mode === 'video');
});
function chipGroup(id, set) {
  $(id).addEventListener('click', e => {
    const c = e.target.closest('.chip'); if (!c) return;
    $(id).querySelectorAll('.chip').forEach(x => x.classList.toggle('on', x === c));
    set(c.dataset.v);
  });
}
chipGroup('res', v => height = v);
chipGroup('afmt', v => { afmt = v; $('aq').disabled = ['flac', 'wav', 'best'].includes(v); });
$('subs').onchange = () => { const o = $('subs').selectedOptions[0]; $('autoSubs').checked = !!(o && o.dataset.auto); };
$('fmts').onclick = e => { const r = e.target.closest('tr'); if (!r) return;
  const cur = $('formatId').value.trim(); const id = r.dataset.id;
  $('formatId').value = cur && !cur.includes('+') && cur !== id ? cur + '+' + id : id; };

// ---- download ----
$('dl').onclick = async () => {
  resetJob();
  const opts = {
    url: $('url').value.trim(), mode,
    height, container: $('container').value, vcodec: $('vcodec').value, fps: $('fps').value,
    audioFormat: afmt, audioQuality: $('aq').disabled ? '' : $('aq').value,
    start: $('start').value.trim(), end: $('end').value.trim(),
    subs: mode === 'video' ? $('subs').value : '', autoSubs: $('autoSubs').checked,
    thumbnail: $('thumbnail').checked, metadata: $('metadata').checked, chapters: $('chapters').checked && info.chapters > 0,
    sponsorblock: [...document.querySelectorAll('#sb input:checked')].map(i => i.value),
    filename: $('filename').value.trim(), rateLimit: $('rate').value.trim(), formatId: $('formatId').value.trim(),
  };
  $('dl').disabled = true; $('dl').innerHTML = '<span class="spin"></span>&nbsp; Preparing…';
  show('prog', true); $('bar').classList.add('busy'); $('stage').textContent = 'Starting'; $('pstat').textContent = '';
  try {
    job = (await api('/api/download', opts)).id;
    poll();
  } catch (err) { fail(err.message); }
};

async function poll() {
  try {
    const j = await api('/api/progress/' + job);
    const bar = $('bar');
    bar.classList.toggle('busy', j.status !== 'downloading' && j.status !== 'done');
    bar.querySelector('i').style.width = j.percent + '%';
    $('stage').textContent = j.stage + (j.status === 'downloading' ? ` · ${j.percent.toFixed(1)}%` : '');
    $('pstat').textContent = j.status === 'downloading' ? [j.speed, j.eta && 'ETA ' + j.eta].filter(Boolean).join(' · ') : '';
    if (j.status === 'done') {
      const href = '/api/file/' + job;
      msg(`Done · ${esc(j.file)} (${fmtSize(j.size)}) — <a href="${href}">save again</a>`, 'ok');
      location.href = href;
      $('dl').disabled = false; $('dl').textContent = 'Download';
      return;
    }
    if (j.status === 'error') return fail(j.error);
    timer = setTimeout(poll, 700);
  } catch (err) { fail(err.message); }
}

function fail(text) { show('prog', false); msg(esc(text), 'err'); $('dl').disabled = false; $('dl').textContent = 'Download'; }
function resetJob() { clearTimeout(timer); show('msg', false); show('prog', false); $('bar').querySelector('i').style.width = 0; }
</script>
</body>
</html>
